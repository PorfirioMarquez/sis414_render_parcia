spring.application.name=sisi414_parcial
server.port=8080

# --- Almacenamiento: H2 embebida en archivo (./data/sisi414_db.mv.db) ---
#spring.datasource.url=jdbc:h2:file:./data/sisi414_db;AUTO_SERVER=TRUE
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sisi414_db;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Las tablas se crean/actualizan solas a partir de las entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola de la BD: http://localhost:8080/h2-console  (JDBC URL = la de arriba, usuario sa, sin clave)
spring.h2.console.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui.html   |   OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Los datos del DBF se cargan una sola vez si la BD esta vacia (ver SeedDataLoader)
sisi414.seed.enabled=true


